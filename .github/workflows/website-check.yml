name: Website check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-link-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:html
      - run: npm run check:links
      - run: npm run check:copy
      - run: npm run test:contract
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/reservation-browser.spec.js
